# 测试环境：
#  1) 使用与运行实例隔离的 craft_test 库（避免开启调度器的后端与测试抢单）；
#  2) 关闭定时扫描，并发性由测试本身显式驱动。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/craft_test?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: craft
    password: craft
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

craft:
  scheduler:
    enabled: false
  token-ttl-hours: 12
